schema_version: 1

context:
  version: "13.0"
  name: pyobjc-framework-Metal

package:
  name: pyobjc-framework-metal
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name.replace('-', '_').lower() }}/${{ name.replace('-', '_') | lower }}-${{ version }}.tar.gz
  sha256: be798a872021520701183f015f1b0fdadbc5ca74e4aee80d0c4952b890c90a7a

build:
  number: 0
  skip: not osx
  script:
    # force pyobjc to use conda-forge's chosen SDK
    - export CFLAGS="${CFLAGS} -isysroot ${SDKROOT:-$CONDA_BUILD_SYSROOT}"
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
  host:
    - python
    - pip
    - setuptools
    - libffi
  run:
    - python
    - pyobjc-core =${{ version }}
    - pyobjc-framework-cocoa =${{ version }}
    - libffi

tests:
  - python:
      imports:
        - Metal
      pip_check: false
  - requirements:
      run:
        - pip
    script:
      - python -c "import Metal; print(Metal.MTLCreateSystemDefaultDevice())"

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Wrappers for the Metal framework on macOS
  homepage: https://github.com/ronaldoussoren/pyobjc
  documentation: https://pyobjc.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - xhochy
